<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1015">
<title>Joint-Friendly Workout</title>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Home: pick a day -->
<section id="home" class="screen">
  <div class="wrap">
    <h1 class="title" id="plan-title"></h1>
    <p class="subtitle" id="plan-subtitle"></p>
    <div class="days" id="days"></div>
    <div class="card" id="plan-rules">
      <div class="label" id="plan-rules-title"></div>
      <ul id="plan-rules-list"></ul>
    </div>
    <p class="note">For the TV: turn off Rotation Lock, hold the phone sideways, then Control Center → Screen Mirroring.</p>
    <p class="note"><button class="link" id="diag-open">Diagnostics</button></p>
    <div class="card" id="diag" hidden>
      <div class="label">Diagnostics</div>
      <p class="note" style="margin-top:6px">If something misbehaves, run the phone check, then copy the log and paste it to Claude.</p>
      <div class="diag-actions">
        <button class="tool" id="diag-check">Run phone check</button>
        <button class="tool" id="diag-copy">Copy log</button>
        <button class="tool" id="diag-clear">Clear</button>
        <span class="note" id="diag-status" style="margin:0"></span>
      </div>
      <div id="diag-video" style="width:200px;aspect-ratio:16/9;margin-top:8px" hidden></div>
      <pre id="diag-text"></pre>
    </div>
  </div>
</section>

<!-- Day: what's in the session, warm-up / cool-down toggles -->
<section id="day" class="screen" hidden>
  <div class="wrap">
    <div class="day-head">
      <button class="back" id="day-back">‹ Days</button>
      <div><div class="label" id="day-kicker"></div><h1 class="title" id="day-title"></h1></div>
    </div>
    <div id="day-body"></div>
    <div class="start-bar" id="start-bar"></div>
  </div>
</section>

<!-- Player: demo video + coaching panel -->
<section id="player" hidden>
  <div class="bar">
    <button class="tool" id="exit-btn" aria-label="Exit">✕</button>
    <div class="where">
      <div class="line" id="where"></div>
      <div class="progress"><i id="progress"></i></div>
    </div>
    <div class="demos">
      <button class="tool" id="vid-prev" aria-label="Previous demo">‹</button>
      <span class="count" id="vid-count"></span>
      <button class="tool" id="vid-next" aria-label="Next demo">›</button>
      <button class="tool" id="vid-restart" aria-label="Restart demo">↺</button>
    </div>
    <button class="tool sound" id="sound-btn" aria-label="Video sound"></button>
    <button class="tool sound" id="voice-btn" aria-label="Coach voice"></button>
  </div>
  <div class="stage" id="stage">
    <div class="video">
      <div id="yt"></div>
      <div class="fallback" id="video-fallback" hidden></div>
      <div class="hint" id="video-hint" hidden></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="finished" id="finished" hidden></div>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
